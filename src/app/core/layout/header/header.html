<div class="flex h-[56px] w-full items-center justify-between px-4 md:px-6">
  <button type="button" (click)="toggleSidebar()" class="rounded-lg p-2 text-slate-600 transition hover:bg-slate-100"
    [pTooltip]="sidebarOpen() ? 'Collapse Sidebar' : 'Expand Sidebar'" tooltipPosition="bottom">
    <i [class]="sidebarOpen() ? 'pi pi-angle-left' : 'pi pi-angle-right'"></i>
  </button>

  <div class="flex items-center gap-2 md:gap-3">
    <!-- Light / Dark / System Theme Toggle Dropdown -->
    <div class="relative">
      <button type="button" (click)="toggleThemeMenu()"
        class="w-9 h-9 rounded-xl flex items-center justify-center border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors shadow-2xs"
        [pTooltip]="'Theme: ' + themeService.themeMode()" tooltipPosition="bottom">
        <i
          [class]="themeService.themeMode() === 'light' ? 'pi pi-sun text-amber-500' : (themeService.themeMode() === 'dark' ? 'pi pi-moon text-indigo-400' : 'pi pi-desktop text-blue-500')"></i>
      </button>

      <!-- Theme Mode Overlay Menu -->
      <div *ngIf="isThemeMenuOpen"
        class="absolute right-0 top-11 mt-1 w-40 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-2 shadow-xl z-50 space-y-1">
        <button type="button" (click)="selectThemeMode('light')"
          [class.bg-slate-100]="themeService.themeMode() === 'light'"
          [class.dark:bg-slate-800]="themeService.themeMode() === 'light'"
          class="w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center justify-between transition-colors cursor-pointer">
          <span class="flex items-center gap-2"><i class="pi pi-sun text-amber-500"></i> Light</span>
          <i *ngIf="themeService.themeMode() === 'light'" class="pi pi-check text-xs text-indigo-600"></i>
        </button>
        <button type="button" (click)="selectThemeMode('dark')"
          [class.bg-slate-100]="themeService.themeMode() === 'dark'"
          [class.dark:bg-slate-800]="themeService.themeMode() === 'dark'"
          class="w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center justify-between transition-colors cursor-pointer">
          <span class="flex items-center gap-2"><i class="pi pi-moon text-indigo-400"></i> Dark</span>
          <i *ngIf="themeService.themeMode() === 'dark'" class="pi pi-check text-xs text-indigo-600"></i>
        </button>
        <button type="button" (click)="selectThemeMode('system')"
          [class.bg-slate-100]="themeService.themeMode() === 'system'"
          [class.dark:bg-slate-800]="themeService.themeMode() === 'system'"
          class="w-full text-left px-3 py-2 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 hover:bg-slate-50 dark:hover:bg-slate-800 flex items-center justify-between transition-colors cursor-pointer">
          <span class="flex items-center gap-2"><i class="pi pi-desktop text-blue-500"></i> System</span>
          <i *ngIf="themeService.themeMode() === 'system'" class="pi pi-check text-xs text-indigo-600"></i>
        </button>
      </div>
    </div>

    <!-- Accent Color Palette Overlay Menu -->
    <div class="relative">
      <button type="button" (click)="toggleColorMenu()"
        class="w-9 h-9 rounded-xl flex items-center justify-center border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-colors shadow-2xs"
        [pTooltip]="'Accent Color: ' + themeService.accentColor()" tooltipPosition="bottom">
        <i class="pi pi-palette text-indigo-600"></i>
      </button>

      <!-- Palette Overlay Dropdown -->
      <div *ngIf="isColorMenuOpen"
        class="absolute right-0 top-11 mt-1 w-52 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-3.5 shadow-xl z-50">
        <span
          class="text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-wider block mb-2">Accent
          Theme Color</span>
        <div class="grid grid-cols-5 gap-2">
          <button *ngFor="let color of themeService.colorsList" (click)="selectAccentColor(color.name)"
            class="w-7 h-7 rounded-full border-2 transition-all hover:scale-110 flex items-center justify-center cursor-pointer"
            [title]="color.label" [ngClass]="[
              color.bgClass,
              themeService.accentColor() === color.name ? 'border-slate-900 dark:border-white scale-110 shadow-sm' : 'border-transparent opacity-85 hover:opacity-100'
            ]">
            <i *ngIf="themeService.accentColor() === color.name" class="pi pi-check text-[10px] text-white"></i>
          </button>

          <!-- Add Custom Color Picker Button (+) -->
          <label title="Pick Custom Hex Color"
            class="w-7 h-7 rounded-full border-2 border-dashed border-slate-400 dark:border-slate-500 hover:border-indigo-600 dark:hover:border-indigo-400 bg-slate-100 dark:bg-slate-800 flex items-center justify-center cursor-pointer transition-all hover:scale-110 relative"
            [class.border-indigo-600]="themeService.accentColor() === 'custom'"
            [style.background-color]="themeService.accentColor() === 'custom' ? themeService.customHexColor() : ''">
            <i
              [class]="themeService.accentColor() === 'custom' ? 'pi pi-check text-[10px] text-white' : 'pi pi-plus text-xs text-slate-600 dark:text-slate-300 font-bold'"></i>
            <input type="color" [value]="themeService.customHexColor()" (input)="onCustomColorPicked($event)"
              class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" />
          </label>
        </div>
      </div>

    </div>

    <!-- Total Earned Salary Till Date Badge -->

      class="relative group cursor-pointer flex items-center gap-2 bg-gradient-to-r from-emerald-50 to-teal-50 dark:from-emerald-950/80 dark:to-teal-950/80 border border-emerald-300/80 dark:border-emerald-700/60 px-3 py-1 rounded-xl shadow-2xs hover:shadow-xs transition-all"

        <span class="text-[10px] font-black text-emerald-700 dark:text-emerald-300 uppercase tracking-wider">Total Earned</span>

          <span class="text-xs md:text-sm font-black text-slate-900 dark:text-white">₹{{ earnedSalaryAmount() | number:'1.0-0' }}</span>
        </div>

    </div> -->

    <!-- Notification Bell -->
    <app-notification></app-notification>

    <p-select [options]="roleOptions()" placeholder="Select Role" optionLabel="rolDes" optionValue="roleId"
      [(ngModel)]="internalSelectedRoleId" [filter]="true" appendTo="body" styleClass="w-32 sm:w-40"
      (onChange)="onRoleDropdownChange($event)" />

    <span class="hidden text-sm font-medium text-slate-700 sm:inline">{{ getUserName() }}</span>
    <p-avatar *ngIf="userProfileService.profilePicture(); else defaultAvatar"
      [image]="userProfileService.profilePicture()!" size="normal" shape="circle"
      class="cursor-pointer border border-slate-200 dark:border-slate-700 overflow-hidden w-8 h-8 flex items-center justify-center"
      (click)="userMenu.toggle($event)">
    </p-avatar>
    <ng-template #defaultAvatar>
      <p-avatar size="normal" shape="circle" class="cursor-pointer !bg-blue-600 !text-white"
        (click)="userMenu.toggle($event)">
        <span>{{ getUserInitial() }}</span>
      </p-avatar>
    </ng-template>
    <p-menu #userMenu [model]="userMenuItems" [popup]="true" [appendTo]="'body'"></p-menu>
  </div>
</div>


<!-- Dedicated Change Password Dialog from Header -->
<p-dialog [(visible)]="changePasswordVisible" [modal]="true" [style]="{width: '420px'}" header="Change Account Password"
  [draggable]="false" [resizable]="false">

  <form [formGroup]="changePasswordForm" (ngSubmit)="submitChangePassword()" class="flex flex-col gap-4 mt-2">
    <div>
      <label for="hdrOldPassword" class="block text-xs font-bold text-slate-700 mb-1">Old Password *</label>
      <p-password id="hdrOldPassword" formControlName="oldPassword" [toggleMask]="true" [feedback]="false"
        styleClass="w-full" inputStyleClass="w-full" placeholder="Enter Old Password" />
      <small *ngIf="changePasswordForm.get('oldPassword')?.touched && changePasswordForm.get('oldPassword')?.invalid"
        class="text-rose-500 text-xs mt-1 block">Old password is required.</small>
    </div>

    <div>
      <label for="hdrNewPassword" class="block text-xs font-bold text-slate-700 mb-1">New Password *</label>
      <p-password id="hdrNewPassword" formControlName="newPassword" [toggleMask]="true" styleClass="w-full"
        inputStyleClass="w-full" placeholder="Enter New Password" />
      <small *ngIf="changePasswordForm.get('newPassword')?.touched && changePasswordForm.get('newPassword')?.invalid"
        class="text-rose-500 text-xs mt-1 block">At least 6 characters required.</small>
    </div>

    <div>
      <label for="hdrConfirmPassword" class="block text-xs font-bold text-slate-700 mb-1">Confirm New Password *</label>
      <p-password id="hdrConfirmPassword" formControlName="confirmPassword" [toggleMask]="true" [feedback]="false"
        styleClass="w-full" inputStyleClass="w-full" placeholder="Re-enter New Password" />
      <small
        *ngIf="changePasswordForm.get('confirmPassword')?.touched && changePasswordForm.get('confirmPassword')?.invalid"
        class="text-rose-500 text-xs mt-1 block">Please confirm new password.</small>
    </div>

    <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
      <p-button label="Cancel" icon="pi pi-times" [outlined]="true" severity="secondary"
        (click)="changePasswordVisible = false"></p-button>
      <p-button label="Update Password" icon="pi pi-check" type="submit" [loading]="savingPassword"
        styleClass="bg-indigo-600 text-white font-bold"></p-button>
    </div>
  </form>
</p-dialog>
