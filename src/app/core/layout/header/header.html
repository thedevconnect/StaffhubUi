<div class="flex h-[56px] w-full items-center justify-between px-4 md:px-6">
  <button type="button" (click)="toggleSidebar()" class="rounded-lg p-2 text-slate-600 transition hover:bg-slate-100"
    [pTooltip]="sidebarOpen() ? 'Collapse Sidebar' : 'Expand Sidebar'" tooltipPosition="bottom">
    <i [class]="sidebarOpen() ? 'pi pi-angle-left' : 'pi pi-angle-right'"></i>
  </button>

  <div class="flex items-center gap-3 md:gap-4">
    <!-- Notification Bell -->
    <app-notification></app-notification>

    <p-select [options]="roleOptions()" placeholder="Select Role" optionLabel="rolDes" optionValue="roleId"
      [(ngModel)]="internalSelectedRoleId" [filter]="true" appendTo="body" styleClass="w-32 sm:w-40"
      (onChange)="onRoleDropdownChange($event)" />

    <span class="hidden text-sm font-medium text-slate-700 sm:inline">{{ getUserName() }}</span>
    <p-avatar size="normal" shape="circle" class="cursor-pointer !bg-blue-600 !text-white"
      (click)="userMenu.toggle($event)">
      <span>{{ getUserInitial() }}</span>
    </p-avatar>
    <p-menu #userMenu [model]="userMenuItems" [popup]="true" [appendTo]="'body'"></p-menu>
  </div>
</div>

<!-- Dedicated Change Password Dialog from Header -->
<p-dialog [(visible)]="changePasswordVisible" [modal]="true" [style]="{width: '420px'}" 
  header="Change Account Password" [draggable]="false" [resizable]="false">
  
  <form [formGroup]="changePasswordForm" (ngSubmit)="submitChangePassword()" class="flex flex-col gap-4 mt-2">
    <div>
      <label for="hdrOldPassword" class="block text-xs font-bold text-slate-700 mb-1">Old Password *</label>
      <p-password id="hdrOldPassword" formControlName="oldPassword" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full" placeholder="Enter Old Password" />
      <small *ngIf="changePasswordForm.get('oldPassword')?.touched && changePasswordForm.get('oldPassword')?.invalid" class="text-rose-500 text-xs mt-1 block">Old password is required.</small>
    </div>

    <div>
      <label for="hdrNewPassword" class="block text-xs font-bold text-slate-700 mb-1">New Password *</label>
      <p-password id="hdrNewPassword" formControlName="newPassword" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full" placeholder="Enter New Password" />
      <small *ngIf="changePasswordForm.get('newPassword')?.touched && changePasswordForm.get('newPassword')?.invalid" class="text-rose-500 text-xs mt-1 block">At least 6 characters required.</small>
    </div>

    <div>
      <label for="hdrConfirmPassword" class="block text-xs font-bold text-slate-700 mb-1">Confirm New Password *</label>
      <p-password id="hdrConfirmPassword" formControlName="confirmPassword" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full" placeholder="Re-enter New Password" />
      <small *ngIf="changePasswordForm.get('confirmPassword')?.touched && changePasswordForm.get('confirmPassword')?.invalid" class="text-rose-500 text-xs mt-1 block">Please confirm new password.</small>
    </div>

    <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
      <p-button label="Cancel" icon="pi pi-times" [outlined]="true" severity="secondary" (click)="changePasswordVisible = false"></p-button>
      <p-button label="Update Password" icon="pi pi-check" type="submit" [loading]="savingPassword" styleClass="bg-indigo-600 text-white font-bold"></p-button>
    </div>
  </form>
</p-dialog>
